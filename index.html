<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中數學互動小測驗</title>
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1rem;
            color: #64748b;
            font-weight: 600;
        }

        .quiz-grid {
            display: grid;
            gap: 16px;
        }

        .quiz-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .quiz-card:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.15);
        }

        .quiz-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.25);
        }

        .quiz-details h3 {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .quiz-details p {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 600;
        }

        .arrow-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: 800;
            transition: all 0.2s ease;
        }

        .quiz-card:hover .arrow-btn {
            background: #3b82f6;
            color: white;
            transform: translateX(3px);
        }

        /* 鎖定/即將推出的卡片樣式 */
        .quiz-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f8fafc;
        }

        .quiz-card.disabled:hover {
            border-color: #e2e8f0;
            transform: none;
            box-shadow: none;
        }

        .quiz-card.disabled .icon-box {
            background: #cbd5e1;
            box-shadow: none;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">MATH QUIZ HUB</span>
            <h1 class="title">國中數學互動小測驗</h1>
            <p class="subtitle">挑選想挑戰的單元</p>
        </div>

        <div class="quiz-grid">
            <!-- 測驗卡片 1 -->
            <a href="square-roots/index.html" class="quiz-card">
                <div class="quiz-info">
                    <div class="icon-box">√</div>
                    <div class="quiz-details">
                        <h3>平方數與平方根測驗</h3>
                        <p>含平方數、基礎與進階平方根速算</p>
                    </div>
                </div>
                <div class="arrow-btn">➔</div>
            </a>

            <!-- 測驗卡片 2 (未來新增單元預留) -->
            <div class="quiz-card disabled">
                <div class="quiz-info">
                    <div class="icon-box">x</div>
                    <div class="quiz-details">
                        <h3> (即將解鎖新單元)</h3>
                        <p>(即將解鎖)</p>
                    </div>
                </div>
                <div class="arrow-btn">🔒</div>
            </div>
        </div>

        <div class="footer">
            © 2026 單細胞數理家教
        </div>
    </div>

</body>
</html>
